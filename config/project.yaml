# Shared configuration for data fetching and (later) the dispersion model.

# Geographic box cached from the reanalysis and searched for TROPOMI pixels.
# west/east in degrees east, south/north in degrees north.
domain:
  west: -27.0
  east: -12.0
  south: 62.0
  north: 67.5

met:
  # Hours of meteorology fetched before onset and after the end of an eruption.
  # The tail lets emissions from the last day be followed to the longest lag.
  pad_before_hours: 6
  pad_after_hours: 72
  # CARRA has 65 hybrid levels, numbered from the model top (1) to the
  # surface (65). Levels kept are lowest_level..65.
  carra_top_level: 20

tropomi:
  pad_before_hours: 24
  pad_after_hours: 72

# Eruption windows (UTC). Vent positions are approximate placeholders for the
# centre of activity; proper time-varying fissure geometry is added with the
# dispersion model.
eruptions:
