[project]
name = "past-so2"
version = "0.1.0"
description = "Lagrangian dispersion and Bayesian inversion of SO2 emissions from Reykjanes fissure eruptions"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "xarray",
    "netCDF4",
    "pyyaml",
    "requests",
    "boto3",
]

[project.optional-dependencies]
met = ["cdsapi", "cfgrib", "eccodes"]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/past_so2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
