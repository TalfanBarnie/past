name: Fetch CARRA meteorology

on:
  workflow_dispatch:
    inputs:
      eruption:
        description: Eruption name from config/project.yaml
        default: sundhnukur-2024-05
      days:
        description: Optional YYYY-MM-DD days (space separated); empty for the whole eruption
        default: ""

permissions:
  contents: read
  actions: write # to start the follow-up run

# The CDS runs one archive request per user at a time, so runs must not overlap.
concurrency:
  group: fetch-met

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      CDSAPI_URL: ${{ vars.CDSAPI_URL }}
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_PRIVATE_BUCKET: ${{ vars.B2_PRIVATE_BUCKET }}
      B2_PRIVATE_KEY_ID: ${{ secrets.B2_PRIVATE_KEY_ID }}
      B2_PRIVATE_APPLICATION_KEY: ${{ secrets.B2_PRIVATE_APPLICATION_KEY }}
      ERUPTION: ${{ inputs.eruption }}
      DAYS: ${{ inputs.days }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[met]"
      # Days already in the bucket are skipped. When the time budget runs out with
      # days left, a follow-up run is started; it waits for this one to finish.
      - id: fetch
        run: python -m past_so2.fetch.carra --eruption "$ERUPTION" --budget-hours 4.0 ${DAYS:+--days $DAYS}
      - if: steps.fetch.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fetch-met.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f eruption="$ERUPTION" -f days="$DAYS"
