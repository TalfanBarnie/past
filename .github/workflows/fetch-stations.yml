name: Fetch station SO2

on:
  workflow_dispatch:
    inputs:
      years:
        description: Years to fetch (space separated)
        default: "2021 2022 2023 2024 2025 2026"

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_PRIVATE_BUCKET: ${{ vars.B2_PRIVATE_BUCKET }}
      B2_PRIVATE_KEY_ID: ${{ secrets.B2_PRIVATE_KEY_ID }}
      B2_PRIVATE_APPLICATION_KEY: ${{ secrets.B2_PRIVATE_APPLICATION_KEY }}
      YEARS: ${{ inputs.years }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m past_so2.fetch.stations --years $YEARS --upload
