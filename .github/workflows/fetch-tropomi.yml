name: Fetch TROPOMI SO2

on:
  workflow_dispatch:
    inputs:
      eruption:
        description: Eruption name from config/project.yaml
        default: sundhnukur-2024-05
      days:
        description: Optional YYYY-MM-DD days (space separated); empty for the whole eruption
        default: ""

permissions:
  contents: read

concurrency:
  group: fetch-tropomi-${{ inputs.eruption }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      B2_ENDPOINT: ${{ vars.B2_ENDPOINT }}
      B2_PRIVATE_BUCKET: ${{ vars.B2_PRIVATE_BUCKET }}
      B2_PRIVATE_KEY_ID: ${{ secrets.B2_PRIVATE_KEY_ID }}
      B2_PRIVATE_APPLICATION_KEY: ${{ secrets.B2_PRIVATE_APPLICATION_KEY }}
      CDSE_S3_ACCESS_KEY: ${{ secrets.CDSE_S3_ACCESS_KEY }}
      CDSE_S3_SECRET_KEY: ${{ secrets.CDSE_S3_SECRET_KEY }}
      ERUPTION: ${{ inputs.eruption }}
      DAYS: ${{ inputs.days }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      # Already-fetched orbits are skipped, so a timed-out run can simply be started again.
      - run: python -m past_so2.fetch.tropomi --eruption "$ERUPTION" ${DAYS:+--days $DAYS}
